options:
  auto_refresh: true

scenarios:
  - name: "Student Withdrawal - Resignation Full Workflow"
    steps:
      - step: "Setup - create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type"
        values:
          name: "Grade Type for Withdrawal Test 1"
          code: "GTSW1"
          sequence: 10

      - step: "Setup - create school"
        action: "create"
        model: "school"
        save_as: "school"
        values:
          name: "School for Withdrawal Test 1"
          code: "SCHSW1"
          grade_type_id: "EVAL: registry['grade_type'].id"

      - step: "Setup - create grade"
        action: "create"
        model: "school_grade"
        save_as: "grade"
        values:
          name: "Grade for Withdrawal Test 1"
          code: "GSW1"
          sequence: 10
          type_id: "EVAL: registry['grade_type'].id"

      - step: "Setup - create grade class"
        action: "create"
        model: "school_grade_class"
        save_as: "grade_class"
        values:
          name: "Class Withdrawal Test 1"
          code: "CLSW1"
          school_id: "EVAL: registry['school'].id"
          grade_id: "EVAL: registry['grade'].id"
          capacity: 30

      - step: "Setup - create academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "academic_year"
        values:
          name: "Year Withdrawal Test 1"
          code: "AYSW1"
          date_start: "2024-07-01"
          date_end: "2025-06-30"

      - step: "Setup - create academic term"
        action: "create"
        model: "school_academic_term"
        save_as: "academic_term"
        values:
          name: "Term Withdrawal Test 1"
          code: "TMSW1"
          date_start: "2024-07-01"
          date_end: "2024-12-31"
          year_id: "EVAL: registry['academic_year'].id"
          enrollment_state: "open"

      - step: "Setup - create student contact"
        action: "create"
        model: "res.partner"
        save_as: "contact"
        values:
          name: "Student Contact Withdrawal Test 1"

      - step: "Setup - create student"
        action: "create"
        model: "school_student"
        save_as: "student"
        values:
          name: "Student Withdrawal Test 1"
          code: "STUSW1"
          contact_id: "EVAL: registry['contact'].id"
          school_id: "EVAL: registry['school'].id"

      - step: "Setup - create enrollment"
        action: "create"
        model: "school_enrollment"
        save_as: "enrollment"
        values:
          date: "2024-07-01"
          academic_year_id: "EVAL: registry['academic_year'].id"
          academic_term_id: "EVAL: registry['academic_term'].id"
          school_id: "EVAL: registry['school'].id"
          grade_id: "EVAL: registry['grade'].id"
          grade_class_id: "EVAL: registry['grade_class'].id"
          student_id: "EVAL: registry['student'].id"
          currency_id: "EVAL: env.company.currency_id.id"

      - step: "Confirm enrollment"
        action: "call"
        target: "enrollment"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve enrollment"
        action: "call"
        target: "enrollment"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Create resignation withdrawal draft"
        action: "create"
        model: "school_student_withdrawal"
        save_as: "withdrawal"
        values:
          date: "2024-08-01"
          effective_date: "2024-08-01"
          student_id: "EVAL: registry['student'].id"
          reason_type: "resignation"
          reason: "Family relocation to another city."

      - step: "Assert withdrawal created in draft"
        action: "assert"
        target: "withdrawal"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          state:
            type: "value"
            expected: "draft"

      - step: "Confirm withdrawal"
        action: "call"
        target: "withdrawal"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve withdrawal"
        action: "call"
        target: "withdrawal"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "done"

      - step: "Assert withdrawal number generated on done"
        action: "assert"
        target: "withdrawal"
        asserts:
          name:
            type: "value"
            operator: "contains"
            expected: "SW"

      - step: "Assert student state is resigned"
        action: "search"
        model: "school_student"
        domain:
          - ["id", "=", "EVAL: registry['student'].id"]
          - ["state", "=", "resigned"]
        save_as: "check_student_resigned"
        expect_count: 1

